name: .NET 10 CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build, Test & Security Audit
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Clonar Repositório
      uses: actions/checkout@v5

    - name: ⚙️ Configurar .NET 10 SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: 🛡️ Restaurar Dependências
      run: dotnet restore

    - name: 🔍 Auditoria de Segurança de Dependências
      run: dotnet list package --vulnerable --include-transitive

    - name: 🔨 Compilar Aplicação e Testes (Release)
      run: dotnet build --configuration Release --no-restore

    - name: 🧪 Executar Testes e Coleta de Cobertura
      run: dotnet test --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

    - name: 📊 Salvar Relatório de Cobertura
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: ./coverage
        retention-days: 7

    - name: 📦 Publicar Aplicação (Publish)
      run: dotnet publish src/ControleFinanceiro.Web/ControleFinanceiro.Web.csproj --configuration Release -o ./publish

    - name: 💾 Salvar Artefato de Publicação
      uses: actions/upload-artifact@v7
      with:
        name: controle-financeiro-app
        path: ./publish
        retention-days: 7

    - name: 🐳 Validar Build da Imagem Docker
      run: docker build -t controle-financeiro:ci .

    - name: 🔐 Login no GitHub Container Registry (GHCR)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 🚀 Publicar Imagem Docker no GHCR
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/controle-financeiro"
        IMAGE_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
        docker tag controle-financeiro:ci "$IMAGE_LOWER:latest"
        docker tag controle-financeiro:ci "$IMAGE_LOWER:${{ github.sha }}"
        docker push "$IMAGE_LOWER:latest"
        docker push "$IMAGE_LOWER:${{ github.sha }}"
